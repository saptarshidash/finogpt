spring:
  application:
    name: finogpt
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  kafka:
    consumer:
      group-id: finogpt-group
      auto-offset-reset: earliest
      enable-auto-commit: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8081}

app:
  ingestion:
    kafka-topic: ${INGESTION_KAFKA_TOPIC:phonepe_transactions}
    fast-api-base-url: ${FASTAPI_BASE_URL:http://127.0.0.1:8000}
    parse-path: ${FASTAPI_PARSE_PATH:/parse-async}
  llm:
    location: ${LLM_LOCATION:global}
    model: ${LLM_MODEL:gemini-2.5-pro}
    vertex-ai-enabled: ${LLM_VERTEX_AI_ENABLED:true}
  security:
    jwt:
      expiration-millis: ${JWT_EXPIRATION_MILLIS:86400000}
